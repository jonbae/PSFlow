# The five gates, and three checks outside the gate scheme, on every pull
# request.
#
# "Gates CI" in this repo's prose used to mean "gates whoever remembered to run
# the script". This is the thing that makes it mean CI: surface parity,
# function parity, the conformance test suite, the smoke test suite and system
# parity, run against every PR, each one failing the pull request check when it
# is red. README's five-gate table is what this file is held to —
# `npm run test:ci` compares the two, so a gate renamed in one place goes red
# rather than quietly dropping out of CI. That section of README says all of
# this at more length.
#
# **System parity runs on every pull request, last among the gates.** It is the
# only gate that sees most of the port's runtime behavior, so a schedule that
# ran it less often would let a regression reach `master` before anything
# noticed. It costs about fifteen minutes of a run whose other steps take three.
# It was kept out while the divergence backlog held it red on purpose; it
# passes, so a red one is a regression. The trigger has no branch or path
# filter: a stacked pull request and a docs-only one run it too.
#
# **Three checks that are not gates run after them.** README lists each among
# the checks that are not gates in the five-gate sense. The boundary checks
# (`parity:boundary`) mount every crossing through `index.js` with server
# renders, which no browser suite reaches. The boundary tests (`test:boundary`)
# hold each crossing's JS entry to upstream. The package check
# (`parity:package`) installs the packed package into a scratch consumer and
# holds it to `index.js`. They run after system parity, so a red one never
# withholds a gate's result, and `npm run test:ci` holds this file to that
# order.
#
# **Ordering is not arbitrary.** Surface parity is the only *hard*
# precondition: interop breakage has a cheap static signature and an expensive
# runtime shadow, so a red one makes every downstream result unreadable rather
# than merely suspect. It runs first, and when it fails the gates after it do
# not run and the run says so. Everything after it is interpretation order —
# cheapest instrument first.
#
# **Every artifact a gate reads is rebuilt here from the tree being tested.**
# `oracle/index.js` and `parity/driver/dist/psflow.js` are committed so a fresh
# clone can run without the gitignored `xyflow/`, and nothing fails when they
# are left stale — a bundle predating `output/` leaves every spec green about
# code that is gone. CI has the vendored tree anyway, so it rebuilds both and
# the gates measure the commit rather than the last artifact someone rebuilt.

name: gates

on:
  pull_request:
  workflow_dispatch:

# A superseded run proves nothing about the head of the branch.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

# Gates read; they do not write.
permissions:
  contents: read

jobs:
  gates:
    name: the five gates
    # Pinned, as the toolchain is: the locked Playwright 1.60.0 installs its
    # Chromium on Ubuntu 24.04 and not on the release `ubuntu-latest` moved
    # to. 24.04 is also the OS of the Playwright image
    # `parity/system/linux.mjs` captures the net in.
    runs-on: ubuntu-24.04
    # The net is most of the run, and a Linux wave has taken 13–15 minutes.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      # >= 22.18 on purpose: `parity/surface/extract-upstream.ts` is run by
      # plain `node`, which strips the types itself.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # Pinned, and taken from the compiler's own release rather than a
      # third-party action: the two versions are what `spago.lock`'s package set
      # was resolved against, and a floating toolchain would make a red gate
      # ambiguous between the port and the compiler.
      - name: Install the PureScript toolchain
        run: |
          curl -fsSL https://github.com/purescript/purescript/releases/download/v0.15.16/linux64.tar.gz | tar -xz -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/purescript/purs" /usr/local/bin/purs
          npm install --global spago@1.0.4
          purs --version
          spago --version

      - name: Install the npm dependencies
        run: npm ci

      # `xyflow/` is gitignored, so CI has no parity baseline until it fetches
      # one. It is resolved from the exact-pinned `@xyflow/*` devDependencies —
      # the declared baseline — and the extracted tree is checked against both
      # pins, so the version CI measures cannot drift from the version the repo
      # says it measures.
      - name: Vendor the parity baseline
        run: node .github/scripts/vendor-baseline.mjs

      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      # Not a gate: it proves this workflow runs what README says it runs.
      - name: CI's own self-tests
        run: npm run test:ci

      - name: Build the PureScript output
        run: spago build

      - name: Rebuild the artifacts the gates read
        run: |
          npm run build:oracle
          npm run build:driver

      # ── The gates ────────────────────────────────────────────────────────

      - name: Surface parity
        id: surface_parity
        run: npm run parity:surface

      # The blocking half is that the steps below are skipped. This is the
      # reporting half: skipped-in-silence reads as "CI did not bother", and
      # what happened is that five results were withheld because they could
      # not have been read.
      - name: Surface parity is red — the rest of the run was not interpreted
        if: failure() && steps.surface_parity.outcome == 'failure'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Surface parity is red

          Function parity, the conformance test suite, the smoke test suite,
          system parity, the boundary checks, the boundary tests and the
          package check did not run. Their results are withheld, not passed.

          Surface parity is the only hard precondition among the gates. Its
          failures are interop-shaped — an export that does not resolve, a
          shape that changed, a positional array arriving as a labelled record
          — and interop breakage has a cheap static signature and an expensive
          runtime shadow. The two browser suites and the net enter through the
          same door that just failed, so what they would report is a reading of
          the door rather than of the port, at twenty minutes a go. Function parity
          measures below that door, at the oracle seam, and may well still be
          green — which is the reassurance to distrust while the surface is
          red.

          Fix surface parity first, then read the rest.
          SUMMARY
          echo "::error title=Surface parity is red::The four gates and three checks after it did not run — see the job summary."

      - name: Function parity — `spago test` also runs the unit tests
        run: spago test

      - name: Conformance test suite
        run: npm run test:conformance

      - name: Smoke test suite
        run: npm run test:smoke

      # In the Playwright image that matches `package-lock.json`, which is
      # where the recorded checkpoints were captured: the capture environment
      # is part of each receipt. The runner mounts this checkout, and the net
      # rebuilds both driver bundles from the `output/` built above.
      - name: System parity
        id: system_parity
        run: node parity/system/linux.mjs npm run parity:system

      # ── Checks outside the gate scheme ───────────────────────────────────

      - name: Boundary checks
        run: npm run parity:boundary

      - name: Boundary tests
        run: npm run test:boundary

      # The package check reads `dist/`, which only the package build writes.
      - name: Build the package
        run: npm run build:package

      - name: Package check
        run: npm run parity:package

      # A browser gate's failure is a trace and a screenshot, and neither
      # survives the runner.
      - name: Keep what the browser gates recorded
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      # A red net is read from its report and the traces behind it, which the
      # net wrote into the checkout and which do not survive the runner either.
      - name: Keep what the net recorded
        if: failure() && steps.system_parity.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: system-parity
          path: |
            parity/system/report.md
            parity/system/coverage.md
            parity/system/traces/
          retention-days: 7
