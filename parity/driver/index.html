<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ps-flow conformance driver</title>
    <!--
      Upstream's own stylesheets, from the exact-pinned devDependency that
      matches the vendored tree. The flow's layout is read by half these
      specs — a bounding box, a transform, a `visibility` — so the styles are
      not decoration here, they are part of what is being compared.
    -->
    <link rel="stylesheet" href="../../node_modules/@xyflow/react/dist/style.css" />
    <link rel="stylesheet" href="../../node_modules/@xyflow/react/dist/base.css" />
    <style>
      /*
        The container's box feeds `fitView`, which feeds the viewport
        transform, which feeds everything downstream of it. Both of the net's
        runs load this page, so the box is identical on both sides by
        construction rather than by two apps happening to agree.
      */
      html, body, #app {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!--
      One page, two bundles. Which library rendered is a *query parameter*
      rather than a second HTML file, because the container above is what feeds
      `fitView` — two files could drift, and a divergence injected there would
      land in precisely the measurement question the net exists to settle.
      `?side=` is invisible to a scenario, which is handed the action
      vocabulary and never the page.

      No parameter means `psflow`: the conformance suite's URLs carry none and
      keep working unchanged.
    -->
    <script type="module">
      const bundles = { psflow: "./dist/psflow.js", upstream: "./dist/upstream.js" };
      const side = new URLSearchParams(location.search).get("side") ?? "psflow";

      // A misspelt side must not render an empty flow: every gate downstream
      // would compare two runs of the same library and report green.
      if (!Object.hasOwn(bundles, side)) {
        const complaint =
          `ps-flow driver: unknown side ${JSON.stringify(side)} — ` +
          `expected ${Object.keys(bundles).join(" or ")}.`;
        document.getElementById("app").textContent = complaint;
        throw new Error(complaint);
      }

      await import(bundles[side]);
    </script>
  </body>
</html>
